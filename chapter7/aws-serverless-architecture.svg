<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">Serverless-Architektur der Blog-Applikation auf AWS</title>
  <desc id="description">Browser requests go through CloudFront to static assets in S3 or to API Gateway and a Lambda function running Express and EJS. Lambda reads and writes blog posts in MongoDB Atlas. Secrets Manager supplies database credentials and CloudWatch receives logs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52657a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2878c8"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52657a; }
      .group-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .detail { font-size: 13px; fill: #52657a; }
      .small { font-size: 12px; fill: #52657a; }
      .flow { fill: none; stroke: #52657a; stroke-width: 2.5; marker-end: url(#arrow); }
      .aux-flow { fill: none; stroke: #2878c8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-blue); }
      .box { stroke-width: 1.5; rx: 14; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">Blog-Applikation: Serverless auf AWS</text>
  <text x="54" y="86" class="subtitle">Serverseitiges Rendering mit Express und EJS; statische Dateien und Datenbank getrennt ausgeliefert</text>

  <rect x="34" y="126" width="176" height="474" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="158" class="group-title">Nutzer</text>

  <rect x="61" y="302" width="122" height="94" class="box" fill="#eef2ff" stroke="#818cf8"/>
  <text x="122" y="340" text-anchor="middle" class="label">Browser</text>
  <text x="122" y="365" text-anchor="middle" class="detail">Website / Formular</text>

  <rect x="238" y="126" width="704" height="474" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="262" y="158" class="group-title">AWS Cloud</text>

  <rect x="282" y="202" width="208" height="100" class="box" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="386" y="241" text-anchor="middle" class="label">CloudFront</text>
  <text x="386" y="266" text-anchor="middle" class="detail">CDN / Routing</text>
  <text x="386" y="285" text-anchor="middle" class="small">Assets → S3 · Seiten → API</text>

  <rect x="564" y="190" width="194" height="100" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="661" y="231" text-anchor="middle" class="label">Amazon S3</text>
  <text x="661" y="257" text-anchor="middle" class="detail">CSS, JavaScript, Bilder</text>
  <text x="661" y="276" text-anchor="middle" class="small">statische Dateien</text>

  <rect x="282" y="396" width="208" height="92" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="386" y="433" text-anchor="middle" class="label">API Gateway</text>
  <text x="386" y="459" text-anchor="middle" class="detail">HTTP API</text>

  <rect x="564" y="376" width="250" height="132" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="689" y="414" text-anchor="middle" class="label">AWS Lambda</text>
  <text x="689" y="440" text-anchor="middle" class="detail">Node.js · Express-Adapter</text>
  <text x="689" y="462" text-anchor="middle" class="detail">Routen und EJS-Rendering</text>
  <text x="689" y="486" text-anchor="middle" class="small">Templates im Deployment-Paket</text>

  <rect x="842" y="190" width="78" height="100" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="881" y="228" text-anchor="middle" class="small" font-weight="700">Secrets</text>
  <text x="881" y="248" text-anchor="middle" class="small">Manager</text>
  <text x="881" y="273" text-anchor="middle" class="small">URI</text>

  <rect x="842" y="396" width="78" height="92" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="881" y="435" text-anchor="middle" class="small" font-weight="700">Cloud</text>
  <text x="881" y="455" text-anchor="middle" class="small">Watch</text>
  <text x="881" y="475" text-anchor="middle" class="small">Logs</text>

  <rect x="982" y="126" width="264" height="474" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1008" y="158" class="group-title">Datenbank</text>
  <rect x="1022" y="302" width="184" height="112" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1114" y="345" text-anchor="middle" class="label">MongoDB Atlas</text>
  <text x="1114" y="372" text-anchor="middle" class="detail">BlogPost-Dokumente</text>
  <text x="1114" y="393" text-anchor="middle" class="small">verwalteter MongoDB-Dienst</text>

  <path d="M183 349 H282" class="flow"/>
  <text x="232" y="335" text-anchor="middle" class="small">HTTPS</text>

  <path d="M490 242 H564" class="flow"/>
  <text x="527" y="228" text-anchor="middle" class="small">Assets</text>

  <path d="M386 302 V396" class="flow"/>
  <text x="398" y="354" class="small">Seiten / Formulare</text>

  <path d="M490 442 H564" class="flow"/>
  <text x="527" y="428" text-anchor="middle" class="small">Invoke</text>

  <path d="M814 442 H1022" class="flow"/>
  <text x="918" y="428" text-anchor="middle" class="small">Mongoose</text>

  <path d="M842 240 H812 V376" class="aux-flow"/>
  <text x="817" y="318" text-anchor="middle" class="small">Secret</text>

  <path d="M814 470 H842" class="aux-flow"/>
  <text x="828" y="493" text-anchor="middle" class="small">Logs</text>

  <rect x="54" y="638" width="1172" height="76" rx="14" fill="#eaf1f8" stroke="#cbd5e1"/>
  <text x="78" y="670" class="label">Deployment &amp; Betrieb</text>
  <text x="78" y="694" class="detail">AWS SAM oder CDK verwaltet API Gateway, Lambda, S3, CloudFront, IAM-Berechtigungen und Umgebungs-Konfiguration.</text>
</svg>
